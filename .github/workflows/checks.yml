name: checks
on: [pull_request, push]
jobs:
  checks:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.14' }
      - run: python -m pip install numpy opencv-python-headless Pillow
      - run: python -m compileall -q site/tools tests
      - run: python tests/check_meta.py
      - run: python -m unittest discover -s tests -p "test_*.py"
