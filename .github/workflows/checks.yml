name: checks
on: [pull_request, push]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Python files compile
        run: python -m py_compile site/tools/*.py
      - name: Meta and override files are valid
        run: python tests/check_meta.py
